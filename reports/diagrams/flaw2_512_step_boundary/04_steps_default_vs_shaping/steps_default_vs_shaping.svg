<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="steps-title steps-desc" id="steps_default_vs_shaping-root">
        <title id="steps-title">Default vs step shaping</title>
        <desc id="steps-desc">A step-sequence timeline where default vLLM puts an arriving prompt into one eager unsplit step of about 36 ms, while step shaping cuts it into steps of at most 512 tokens, plus a panel of measured results.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #steps_default_vs_shaping-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
      #steps_default_vs_shaping-root { font-family: var(--font-sans); color: var(--color-ink); }
      #steps_default_vs_shaping-root .diagram-container { width:100%; overflow-x:auto; }
      #steps_default_vs_shaping-root .n { font:600 13px 'Geist',sans-serif;fill:#2d3142 }
      #steps_default_vs_shaping-root .s { font:400 10px 'Geist Mono',monospace;fill:#4f5d75 }
      #steps_default_vs_shaping-root .l { font:500 10px 'Geist Mono',monospace;fill:#4f5d75;letter-spacing:.06em }
      #steps_default_vs_shaping-root .h { font:600 11px 'Geist Mono',monospace;fill:#4f5d75;letter-spacing:.14em }
      #steps_default_vs_shaping-root .t { font:italic 400 16px 'Instrument Serif',serif;fill:#2d3142 }
      #steps_default_vs_shaping-root .diagram-container { overflow-x:visible }</style>
          <marker id="steps_default_vs_shaping-st-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <text x="30" y="24" class="s" style="font-size:11px">Time runs left to right. Each block is one step (one forward pass). Only the ~36 ms X step is a measured width; other widths are qualitative.</text>

        <!-- DEFAULT ROW -->
        <text x="30" y="56" class="h" style="fill:#eb6c36">DEFAULT vLLM (token budget 8,192 per step)</text>
        <!-- arrival arrow -->
        <line x1="388" y1="76" x2="388" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#steps_default_vs_shaping-st-arrow)"/>
        <text x="396" y="90" class="s" style="fill:#2d3142">prompt arrives (450-1000 tokens)</text>
        <!-- small steps -->
        <g fill="#e6edf8" stroke="#2e5aa8" stroke-width="1.2">
          <rect x="30" y="112" width="44" height="56"/><rect x="80" y="112" width="44" height="56"/><rect x="130" y="112" width="44" height="56"/><rect x="180" y="112" width="44" height="56"/><rect x="230" y="112" width="44" height="56"/><rect x="280" y="112" width="44" height="56"/><rect x="330" y="112" width="44" height="56"/>
          <rect x="800" y="112" width="44" height="56"/><rect x="850" y="112" width="44" height="56"/><rect x="900" y="112" width="44" height="56"/>
        </g>
        <text x="202" y="186" text-anchor="middle" class="s">small decode steps: T ≤ 512, graphed, split (short)</text>
        <!-- X step -->
        <rect x="388" y="112" width="400" height="56" fill="#fdece4" stroke="#eb6c36" stroke-width="2"/>
        <text x="588" y="134" text-anchor="middle" class="n">X step: whole chunk + 24k decodes, T &gt; 512</text>
        <text x="588" y="150" text-anchor="middle" class="s">eager (CPU launches every kernel) + FA3 picks 1 split</text>
        <text x="588" y="162" text-anchor="middle" class="s" style="fill:#eb6c36;font-weight:600">~36 ms on average (idle SMs, straggler)</text>
        <line x1="388" y1="196" x2="788" y2="196" stroke="#eb6c36" stroke-width="1.2"/>
        <line x1="388" y1="191" x2="388" y2="201" stroke="#eb6c36"/><line x1="788" y1="191" x2="788" y2="201" stroke="#eb6c36"/>
        <text x="588" y="214" text-anchor="middle" class="s">one step carries the whole prompt</text>

        <!-- SHAPING ROW -->
        <text x="30" y="256" class="h" style="fill:#2e5aa8">STEP SHAPING (cap 512 tokens while a ≥ 4,096-token decode runs)</text>
        <line x1="388" y1="276" x2="388" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#steps_default_vs_shaping-st-arrow)"/>
        <text x="396" y="290" class="s" style="fill:#2d3142">same prompt arrives</text>
        <g fill="#e6edf8" stroke="#2e5aa8" stroke-width="1.2">
          <rect x="30" y="312" width="44" height="56"/><rect x="80" y="312" width="44" height="56"/><rect x="130" y="312" width="44" height="56"/><rect x="180" y="312" width="44" height="56"/><rect x="230" y="312" width="44" height="56"/><rect x="280" y="312" width="44" height="56"/><rect x="330" y="312" width="44" height="56"/>
          <rect x="800" y="312" width="44" height="56"/><rect x="850" y="312" width="44" height="56"/><rect x="900" y="312" width="44" height="56"/>
        </g>
        <g fill="#e6edf8" stroke="#2e5aa8" stroke-width="2">
          <rect x="388" y="312" width="96" height="56"/><rect x="494" y="312" width="96" height="56"/><rect x="600" y="312" width="96" height="56"/>
        </g>
        <text x="436" y="336" text-anchor="middle" class="n" style="font-size:11px">chunk 1</text>
        <text x="436" y="352" text-anchor="middle" class="s">T ≤ 512</text>
        <text x="542" y="336" text-anchor="middle" class="n" style="font-size:11px">chunk 2</text>
        <text x="542" y="352" text-anchor="middle" class="s">T ≤ 512</text>
        <text x="648" y="336" text-anchor="middle" class="n" style="font-size:11px">chunk n</text>
        <text x="648" y="352" text-anchor="middle" class="s">T ≤ 512</text>
        <text x="202" y="386" text-anchor="middle" class="s">small decode steps: graphed, split</text>
        <text x="542" y="386" text-anchor="middle" class="s">prompt cut into steps; every step keeps the graph and the split</text>
        <text x="30" y="414" class="s">Limit is lifted if the prefill backlog exceeds 16,384 tokens. Long 24k prompts' own prefill is left uncapped on purpose.</text>

        <!-- RESULTS PANEL -->
        <rect x="20" y="436" width="960" height="274" rx="6" fill="#fff" stroke="#c9ccd6"/>
        <text x="40" y="462" class="h">MEASURED: "X-HEAVY" WORKLOAD, QWEN3-8B</text>
        <text x="40" y="480" class="s">Short-request mean end-to-end latency speedup vs default (3 repeats, mean ± std; 1.00x = default)</text>

        <!-- bars: scale 1.00x = 180px => 1.27x ~ 229px -->
        <g class="s" style="fill:#2d3142">
          <text x="40" y="508">Default vLLM</text>
          <text x="40" y="534">Capture size 2048 (static)</text>
          <text x="40" y="560">Token budget 512 (static)</text>
          <text x="40" y="586">C3 kernel fix (force split)</text>
          <text x="40" y="612">Step shaping</text>
          <text x="40" y="638">Shaping + C3 + memory plan</text>
        </g>
        <rect x="240" y="496" width="180" height="16" fill="#c9d0de" stroke="#4f5d75"/><text x="428" y="508" class="s" style="fill:#2d3142">1.00x</text>
        <rect x="240" y="522" width="205" height="16" fill="#c9d0de" stroke="#4f5d75"/><text x="453" y="534" class="s" style="fill:#2d3142">1.14x (1 run)</text>
        <rect x="240" y="548" width="194" height="16" fill="#c9d0de" stroke="#4f5d75"/><text x="442" y="560" class="s" style="fill:#2d3142">1.08 ± 0.01x</text><text x="530" y="560" class="s" style="fill:#eb6c36;font-weight:600">TTFT 0.47x (2x worse)</text>
        <rect x="240" y="574" width="212" height="16" fill="#c9d0de" stroke="#4f5d75"/><text x="460" y="586" class="s" style="fill:#2d3142">1.18 ± 0.03x</text>
        <rect x="240" y="600" width="227" height="16" fill="#2e5aa8" stroke="#2e5aa8"/><text x="475" y="612" class="s" style="fill:#2e5aa8;font-weight:600">1.26 ± 0.03x</text><text x="553" y="612" class="s">long TPOT 1.26x, TTFT 0.96x</text>
        <rect x="240" y="626" width="229" height="16" fill="#2e5aa8" stroke="#2e5aa8"/><text x="477" y="638" class="s">1.27 ± 0.03x</text><text x="553" y="638" class="s">C3 adds nothing here</text>

        <!-- right-hand stat blocks -->
        <rect x="760" y="496" width="200" height="68" rx="6" fill="#fdece4" stroke="#eb6c36"/>
        <text x="860" y="518" text-anchor="middle" class="s" style="fill:#2d3142">X steps' share of GPU time</text>
        <text x="860" y="544" text-anchor="middle" class="n" style="font-size:20px">56% → 7%</text>
        <text x="860" y="558" text-anchor="middle" class="s">default → shaping</text>
        <rect x="760" y="574" width="200" height="68" rx="6" fill="#e6edf8" stroke="#2e5aa8"/>
        <text x="860" y="596" text-anchor="middle" class="s" style="fill:#2d3142">Steps in a 3 s window</text>
        <text x="860" y="622" text-anchor="middle" class="n" style="font-size:20px">132 → 177</text>
        <text x="860" y="636" text-anchor="middle" class="s">default → shaping</text>
        <text x="40" y="670" class="s">Default: X steps average 36 ms; 61.6% of GPU time is eager with 1 split. Shaping: eager falls to 20.4%.</text>
        <text x="40" y="686" class="s">Other models (1 run each): Llama-3.1-8B shaping 1.25x vs capture-2048 1.16x; Qwen3-4B shaping 1.14x vs capture-2048 1.17x.</text>
        <text x="40" y="702" class="s">Workload: 4 requests with 24k-token contexts decode; 24 new requests/s arrive with 450-1000-token prompts.</text>

        <!-- legend -->
        <rect x="20" y="730" width="12" height="12" fill="#e6edf8" stroke="#2e5aa8"/>
        <text x="40" y="740" class="s">fast step (T ≤ 512, graph + split)</text>
        <rect x="300" y="730" width="12" height="12" fill="#fdece4" stroke="#eb6c36"/>
        <text x="320" y="740" class="s">slow step (T &gt; 512, eager + 1 split)</text>
        <rect x="580" y="730" width="12" height="12" fill="#c9d0de" stroke="#4f5d75"/>
        <text x="600" y="740" class="s">static / partial fixes</text>
      </svg>
