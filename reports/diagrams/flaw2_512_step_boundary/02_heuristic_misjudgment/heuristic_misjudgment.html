<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What FA3 Counts vs Real Work</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:1000px; display:block; }
    .n{font:600 13px 'Geist',sans-serif;fill:#2d3142}
    .s{font:400 10px 'Geist Mono',monospace;fill:#4f5d75}
    .l{font:500 10px 'Geist Mono',monospace;fill:#4f5d75;letter-spacing:.06em}
    .h{font:600 11px 'Geist Mono',monospace;fill:#4f5d75;letter-spacing:.14em}
    .m{font:500 13px 'Geist Mono',monospace;fill:#2d3142}
    .t{font:italic 400 16px 'Instrument Serif',serif;fill:#2d3142}
    @media print { .diagram-container{overflow-x:visible} svg{min-width:0} }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Contrast · Flaw 2 · the 512-token step boundary</p>
    <h1>The split heuristic counts query tiles, but the real work is in KV length</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heur-title heur-desc">
        <title id="heur-title">What the heuristic counts vs what the work is</title>
        <desc id="heur-desc">FA3 counts query tiles of the longest prefill chunk and sees a full GPU at 417 tokens or more, while the real step has many short tiles and 8 very long tiles for one long-context decode.</desc>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- panels -->
        <rect x="30" y="20" width="450" height="470" rx="6" fill="#fff" stroke="#c9ccd6"/>
        <rect x="520" y="20" width="450" height="470" rx="6" fill="#fff" stroke="#c9ccd6"/>
        <text x="50" y="46" class="h">WHAT THE HEURISTIC COUNTS</text>
        <text x="540" y="46" class="h">WHAT THE WORK REALLY IS</text>

        <!-- LEFT -->
        <rect x="50" y="62" width="410" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="255" y="83" text-anchor="middle" class="n">Treats the whole batch as ONE sequence</text>
        <text x="255" y="99" text-anchor="middle" class="s">query length = max_q, the longest prefill chunk</text>

        <rect x="50" y="124" width="410" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="255" y="148" text-anchor="middle" class="m">tiles = 8 × ceil(max_q × 4 / 128)</text>
        <text x="255" y="168" text-anchor="middle" class="m">      = 8 × ceil(max_q / 32)</text>
        <text x="255" y="182" text-anchor="middle" class="s">8 KV heads, GQA group 4, 128 query rows per tile</text>

        <rect x="50" y="202" width="410" height="48" rx="6" fill="#fdece4" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="255" y="223" text-anchor="middle" class="n">tiles ≥ 0.8 × 132 SMs = 105.6 ?</text>
        <text x="255" y="239" text-anchor="middle" class="s">yes: "GPU already full, splitting adds overhead" → 1 split</text>

        <rect x="50" y="264" width="410" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="255" y="285" text-anchor="middle" class="n">ceil(max_q / 32) ≥ 14  →  max_q ≥ 417 tokens</text>
        <text x="255" y="301" text-anchor="middle" class="s">measured: 256 and 416 tokens still split; 417+ does not</text>

        <text x="50" y="338" class="l">TILE COUNT FOR TWO CHUNK SIZES (tiles)</text>
        <text x="60" y="360" class="s">416-token chunk: 8 × 13 = 104 tiles → below threshold → splits</text>
        <rect x="60" y="366" width="198" height="20" fill="#e6edf8" stroke="#2e5aa8"/>
        <text x="60" y="408" class="s">700-token chunk: 8 × 22 = 176 tiles → above threshold → 1 split</text>
        <rect x="60" y="414" width="334" height="20" fill="#fdece4" stroke="#eb6c36"/>
        <line x1="260" y1="346" x2="260" y2="442" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/>
        <rect x="270" y="440" width="150" height="16" fill="#fff"/>
        <text x="274" y="452" class="s">threshold 105.6 tiles</text>
        <text x="60" y="476" class="s">bar length = tile count (0 to 200 tiles)</text>

        <!-- RIGHT -->
        <text x="540" y="70" class="s">Same step: a 700-token chunk, short decodes, one 32k-context decode</text>

        <text x="540" y="94" class="n" style="font-size:12px">Prefill chunk: 8 × 22 = 176 short tiles</text>
        <g fill="#c9d0de" stroke="#4f5d75" stroke-width=".8">
          <rect x="540" y="102" width="14" height="14"/><rect x="558" y="102" width="14" height="14"/><rect x="576" y="102" width="14" height="14"/><rect x="594" y="102" width="14" height="14"/><rect x="612" y="102" width="14" height="14"/><rect x="630" y="102" width="14" height="14"/><rect x="648" y="102" width="14" height="14"/><rect x="666" y="102" width="14" height="14"/><rect x="684" y="102" width="14" height="14"/><rect x="702" y="102" width="14" height="14"/><rect x="720" y="102" width="14" height="14"/><rect x="738" y="102" width="14" height="14"/><rect x="756" y="102" width="14" height="14"/><rect x="774" y="102" width="14" height="14"/><rect x="792" y="102" width="14" height="14"/><rect x="810" y="102" width="14" height="14"/><rect x="828" y="102" width="14" height="14"/><rect x="846" y="102" width="14" height="14"/><rect x="864" y="102" width="14" height="14"/><rect x="882" y="102" width="14" height="14"/><rect x="900" y="102" width="14" height="14"/><rect x="918" y="102" width="14" height="14"/>
        </g>
        <text x="540" y="132" class="s">22 tiles per KV head shown; each reads only its own short context</text>

        <text x="540" y="160" class="n" style="font-size:12px">Short decodes: 1 tile per KV head each</text>
        <g fill="#c9d0de" stroke="#4f5d75" stroke-width=".8">
          <rect x="540" y="168" width="8" height="14"/><rect x="552" y="168" width="8" height="14"/><rect x="564" y="168" width="8" height="14"/><rect x="576" y="168" width="8" height="14"/><rect x="588" y="168" width="8" height="14"/><rect x="600" y="168" width="8" height="14"/><rect x="612" y="168" width="8" height="14"/><rect x="624" y="168" width="8" height="14"/>
        </g>
        <text x="644" y="179" class="s">tiny: short context</text>

        <text x="540" y="212" class="n" style="font-size:12px;fill:#eb6c36">32k decode: 8 tiles, one per KV head</text>
        <g stroke="#eb6c36" fill="#fdece4" stroke-width="1.2">
          <rect x="610" y="224" width="320" height="14"/><rect x="610" y="244" width="320" height="14"/><rect x="610" y="264" width="320" height="14"/><rect x="610" y="284" width="320" height="14"/><rect x="610" y="304" width="320" height="14"/><rect x="610" y="324" width="320" height="14"/><rect x="610" y="344" width="320" height="14"/><rect x="610" y="364" width="320" height="14"/>
        </g>
        <text x="540" y="235" class="s">KV head 0</text>
        <text x="540" y="375" class="s">KV head 7</text>
        <text x="770" y="300" text-anchor="middle" class="s" style="fill:#2d3142">each reads the whole 32,768-token KV</text>
        <text x="770" y="312" text-anchor="middle" class="s" style="fill:#2d3142">(~16.8 MB per layer)</text>
        <text x="540" y="406" class="s">tile length = how much KV it must read (long bar = long work)</text>

        <rect x="540" y="422" width="410" height="52" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="745" y="444" text-anchor="middle" class="n">8 long tiles are hidden among 176+ short ones</text>
        <text x="745" y="462" text-anchor="middle" class="s">the heuristic never looks at per-row KV length</text>

        <!-- "same step" connector -->
        <line x1="480" y1="255" x2="520" y2="255" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#h-arrow)"/>
        <defs><marker id="h-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>

        <!-- verdict -->
        <rect x="30" y="510" width="450" height="64" rx="6" fill="#e6edf8" stroke="#2e5aa8" stroke-width="1.4"/>
        <text x="255" y="534" text-anchor="middle" class="n">Uniform batch, e.g. one big prefill: heuristic is right</text>
        <text x="255" y="552" text-anchor="middle" class="s">query tiles are about equal work, so the GPU really is full</text>
        <rect x="520" y="510" width="450" height="64" rx="6" fill="#fdece4" stroke="#eb6c36" stroke-width="2"/>
        <text x="745" y="534" text-anchor="middle" class="n">Mixed batch + one long decode: heuristic is wrong</text>
        <text x="745" y="552" text-anchor="middle" class="s">tiles are very unequal; 8 SMs get the long work, the rest idle</text>

        <!-- legend -->
        <rect x="30" y="604" width="12" height="12" rx="2" fill="#e6edf8" stroke="#2e5aa8"/>
        <text x="50" y="614" class="s">splits (fast path)</text>
        <rect x="190" y="604" width="12" height="12" rx="2" fill="#fdece4" stroke="#eb6c36"/>
        <text x="210" y="614" class="s">1 split (slow path) / long tiles</text>
        <rect x="430" y="604" width="12" height="12" fill="#c9d0de" stroke="#4f5d75"/>
        <text x="450" y="614" class="s">short tile</text>
        <text x="560" y="614" class="s">Qwen3-8B: 32 query heads, 8 KV heads, head dim 128, H100 = 132 SMs</text>
      </svg>
    </div>
  </div>
</body>
</html>
