<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pass_vs_parent-title pass_vs_parent-desc" id="pass_vs_parent-root">
        <title id="pass_vs_parent-title">Each pass against its parent arm</title>
        <desc id="pass_vs_parent-desc">Dot plot on a log axis of pass-to-parent ratios for ten pass and workload rows: peak fit plus backfill is far below 1.0 on three workloads and worse on long requests in burst_v3, while D park on peak fit, C plan cache and E KV release sit inside noise.</desc>
