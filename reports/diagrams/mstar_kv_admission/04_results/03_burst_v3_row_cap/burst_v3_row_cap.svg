<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="burst_v3_row_cap-title burst_v3_row_cap-desc" id="burst_v3_row_cap-root">
        <title id="burst_v3_row_cap-title">burst_v3: 90 requests in decode meet a 64-row cap</title>
        <desc id="burst_v3_row_cap-desc">Timeline over three engine steps: with at most 64 requests in decode every step is one batch and each request gets a token per step; with 90 requests a 64-row batch is followed by an under-filled 26-row batch, so each request gets a token every second step.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #burst_v3_row_cap-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #eb6c36;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #burst_v3_row_cap-root { font-family: var(--font-sans); color: var(--color-ink); }
      #burst_v3_row_cap-root .diagram-container { width: 100%; overflow-x: auto; }
      #burst_v3_row_cap-root .diagram-container { overflow-x: visible; }</style>
          <marker id="burst_v3_row_cap-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="burst_v3_row_cap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="burst_v3_row_cap-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <text x="24" y="58" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">ENGINE STEPS, ONE SLOT EACH</text>
        <line x1="288" y1="64" x2="904" y2="64" stroke="#4f5d75" stroke-width="1" marker-end="url(#burst_v3_row_cap-arrow)"/>
        <circle cx="384" cy="64" r="3" fill="#2d3142"/>
        <text x="384" y="52" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">step k</text>
        <circle cx="592" cy="64" r="3" fill="#2d3142"/>
        <text x="592" y="52" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">step k+1</text>
        <circle cx="800" cy="64" r="3" fill="#2d3142"/>
        <text x="800" y="52" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">step k+2</text>
        <text x="24" y="112" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">At most 64 in decode</text>
        <text x="24" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">1 token per step</text>
        <text x="292" y="91" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">64</text>
        <rect x="300" y="88" width="168" height="96" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="384" y="132" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">rows 1–N</text>
        <text x="384" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one batch</text>
        <rect x="508" y="88" width="168" height="96" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="592" y="132" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">rows 1–N</text>
        <text x="592" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one batch</text>
        <rect x="716" y="88" width="168" height="96" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="800" y="132" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">rows 1–N</text>
        <text x="800" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one batch</text>
        <text x="24" y="211" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">token for request in row 1</text>
        <circle cx="384" cy="208" r="5" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
        <circle cx="592" cy="208" r="5" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
        <circle cx="800" cy="208" r="5" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
        <line x1="16" y1="232" x2="904" y2="232" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="24" y="280" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">90 in decode</text>
        <text x="24" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">1 token per 2 steps</text>
        <text x="292" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">64</text>
        <rect x="300" y="256" width="168" height="96" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="384" y="300" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">rows 1–64</text>
        <text x="384" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">full batch</text>
        <rect x="716" y="256" width="168" height="96" rx="4" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="800" y="300" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">rows 1–64</text>
        <text x="800" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">full batch</text>
        <rect x="508" y="256" width="168" height="96" rx="4" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="592" y="288" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.1em">GPU under-filled</text>
        <rect x="508" y="313" width="168" height="39" rx="4" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="592" y="329" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">rows 65–90</text>
        <text x="592" y="342" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">26 rows</text>
        <text x="24" y="379" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">token for request in row 1</text>
        <circle cx="384" cy="376" r="5" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
        <circle cx="592" cy="376" r="5" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.5"/>
        <circle cx="800" cy="376" r="5" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
        <line x1="924" y1="76" x2="924" y2="412" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="940" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">PEAK FIT ADMITS ALL 90</text>
        <text x="940" y="102" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">All 90 long requests fit by pages, so all 90</text>
        <text x="940" y="117" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">are in decode at once. Above 64 rows, mstar</text>
        <text x="940" y="132" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">runs a 64-row batch, then a second batch</text>
        <text x="940" y="147" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">with the rest. AC's summed fit happened to</text>
        <text x="940" y="162" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">admit fewer at once.</text>
        <line x1="940" y1="176" x2="1256" y2="176" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="940" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">COST ON BURST_V3</text>
        <text x="940" y="228" fill="#2d3142" font-size="26" font-family="'Instrument Serif', serif">79.8 → 89.5 s</text>
        <text x="940" y="246" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Long E2E +12%. Output tok/s unchanged.</text>
        <line x1="940" y1="264" x2="1256" y2="264" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="940" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">WHY THE SIMULATOR MISSED IT</text>
        <text x="940" y="302" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">The CPU simulator has no row cap. It</text>
        <text x="940" y="317" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">predicted a 2.4–3.9x short-E2E gain on</text>
        <text x="940" y="332" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">burst_v3. Measured: 0.94x, inside noise.</text>
        <line x1="940" y1="346" x2="1256" y2="346" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="940" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">NEXT · PHASE 2</text>
        <text x="940" y="384" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Decode capture sizes above 64 rows,</text>
        <text x="940" y="399" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">and/or a cap on admitted decode rows at</text>
        <text x="940" y="414" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">the capture size.</text>
        <line x1="24" y1="436" x2="1256" y2="436" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="24" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="96" y="443" width="16" height="10" rx="2" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="120" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">rows in that step's batch</text>
        <rect x="292" y="443" width="16" height="10" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="316" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">64-row capture size</text>
        <rect x="448" y="443" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="472" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">under-filled second batch</text>
        <circle cx="649" cy="448" r="5" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
        <text x="662" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">token this step</text>
        <circle cx="777" cy="448" r="5" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.5"/>
        <text x="790" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">no token this step</text>
      </svg>
