<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banker's grant guard</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    .n { font: 600 12px 'Geist', sans-serif; fill: #2d3142; }
    .s { font: 400 9px 'Geist Mono', monospace; fill: #4f5d75; }
    .e { font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.12em; fill: #4f5d75; }
    .c { font: italic 400 14px 'Instrument Serif', 'Noto Serif', serif; fill: #2d3142; }
    .k { font: 400 9px 'Geist', sans-serif; fill: #4f5d75; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Admission policy · Phase 1</p>
    <h1>A page is granted only if every admitted request can still finish</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bankers-grant-guard-title bankers-grant-guard-desc">
        <title id="bankers-grant-guard-title">Banker's grant guard</title>
        <desc id="bankers-grant-guard-desc">Flowchart of the grant guard: before the pool gives an admitted request one more page, a safe-state test checks that every admitted request can still reach max_tokens and complete; if yes the page is granted, if no the grant waits and is retried next step.</desc>
        <defs>
          <marker id="bgg-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <text x="940" y="52" class="e" text-anchor="end">ON WHENEVER MSTAR_KV_ADMISSION_FIT=peak</text>

        <!-- Arrows (behind nodes) -->
        <line x1="400" y1="88" x2="400" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bgg-arrow)"/>
        <line x1="400" y1="216" x2="400" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bgg-arrow)"/>
        <line x1="480" y1="288" x2="640" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bgg-arrow)"/>
        <line x1="400" y1="328" x2="400" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bgg-arrow)"/>
        <!-- Retry loop: Wait back to the start (dashed, return path) -->
        <path d="M 300 396 H 208 Q 200 396 200 388 V 72 Q 200 64 208 64 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bgg-arrow)"/>

        <!-- Arrow labels (masked) -->
        <rect x="544" y="268" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="277" class="e" text-anchor="middle">YES</text>
        <rect x="408" y="342" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="351" class="e" text-anchor="middle">NO</text>
        <rect x="156" y="224" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="174" y="233" class="e" text-anchor="middle">RETRY</text>

        <!-- Annotation leader (dashed, to the Wait node) -->
        <line x1="504" y1="396" x2="572" y2="396" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="502" cy="396" r="2" fill="#2d3142"/>
        <text x="580" y="392" class="c">Why: blocks the over-commit that main hits,</text>
        <text x="580" y="408" class="c">where requests hold pages while waiting for pages.</text>

        <!-- Start oval -->
        <rect x="280" y="40" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="400" y="62" class="n" text-anchor="middle">Decode needs one more page</text>
        <text x="400" y="76" class="s" text-anchor="middle">request is already admitted</text>

        <!-- Focal: safe-state test -->
        <rect x="240" y="128" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="128" width="320" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="400" y="150" class="n" text-anchor="middle">Safe-state test (Banker's)</text>
        <text x="400" y="168" class="s" text-anchor="middle">With this grant, can every admitted request still</text>
        <text x="400" y="181" class="s" text-anchor="middle">reach its max_tokens and complete, in some</text>
        <text x="400" y="194" class="s" text-anchor="middle">completion order?</text>

        <!-- Decision -->
        <polygon points="400,248 480,288 400,328 320,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="292" class="n" text-anchor="middle">Safe?</text>

        <!-- Grant -->
        <rect x="640" y="260" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="740" y="284" class="n" text-anchor="middle">Grant the page</text>
        <text x="740" y="298" class="s" text-anchor="middle">decode continues</text>

        <!-- Wait -->
        <rect x="300" y="368" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="392" class="n" text-anchor="middle">Wait</text>
        <text x="400" y="406" class="s" text-anchor="middle">grant retried next step</text>

        <!-- Legend -->
        <line x1="20" y1="452" x2="940" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="20" y="468" class="e">LEGEND</text>
        <rect x="20" y="476" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="52" y="486" class="k">Start / end</text>
        <rect x="160" y="476" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="192" y="486" class="k">Step</text>
        <polygon points="272,482 284,476 296,482 284,488" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="304" y="486" class="k">Decision</text>
        <rect x="400" y="476" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="432" y="486" class="k">The guard: safe-state test</text>
        <line x1="600" y1="482" x2="628" y2="482" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="636" y="486" class="k">Retry on the next step</text>

        <text x="20" y="508" class="s">Admission (peak fit) decides who may start. The grant guard decides when an already-admitted request may take its next page.</text>
      </svg>
    </div>
  </div>
</body>
</html>
