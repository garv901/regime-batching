<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sum-vs-peak-fit-title sum-vs-peak-fit-desc" id="sum_vs_peak_fit-root">
        <title id="sum-vs-peak-fit-title">Summed fit versus peak fit</title>
        <desc id="sum-vs-peak-fit-desc">Two panels with the same three illustrative requests: summed fit adds every request's own peak as if they peak together and refuses, while peak fit adds the page curves over time and admits because the highest point of the sum is below the pool capacity.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sum_vs_peak_fit-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sum_vs_peak_fit-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sum_vs_peak_fit-root .diagram-container { width: 100%; overflow-x: auto; }
      #sum_vs_peak_fit-root .n { font: 600 12px 'Geist', sans-serif; fill: #2d3142; }
      #sum_vs_peak_fit-root .s { font: 400 9px 'Geist Mono', monospace; fill: #4f5d75; }
      #sum_vs_peak_fit-root .e { font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; fill: #4f5d75; }
      #sum_vs_peak_fit-root .c { font: italic 400 14px 'Instrument Serif', 'Noto Serif', serif; fill: #2d3142; }
      #sum_vs_peak_fit-root .k { font: 400 9px 'Geist', sans-serif; fill: #4f5d75; }
      #sum_vs_peak_fit-root .diagram-container { overflow-x: visible; }</style>
          <marker id="sum_vs_peak_fit-spf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="20" y="16" width="450" height="420" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.14"/>
        <text x="40" y="44" class="n">Summed fit (AC)</text>
        <text x="40" y="60" class="s">MSTAR_KV_ADMISSION_FIT=sum</text>
        <polygon points="76.0,340.0 76.0,322.0 230.0,268.0 230.0,340.0" fill="#2d3142" fill-opacity="0.05" stroke="none"/>
        <polyline points="76.0,340.0 76.0,322.0 230.0,268.0 230.0,340.0" fill="none" stroke="#2d3142" stroke-opacity="0.70" stroke-width="1.2"/>
        <text x="224.0" y="260.0" class="n" style="font-size:11px" text-anchor="end">A</text>
        <polygon points="142.0,340.0 142.0,322.0 296.0,268.0 296.0,340.0" fill="#2d3142" fill-opacity="0.05" stroke="none"/>
        <polyline points="142.0,340.0 142.0,322.0 296.0,268.0 296.0,340.0" fill="none" stroke="#2d3142" stroke-opacity="0.70" stroke-width="1.2"/>
        <text x="290.0" y="260.0" class="n" style="font-size:11px" text-anchor="end">B</text>
        <polygon points="208.0,340.0 208.0,322.0 362.0,268.0 362.0,340.0" fill="#2d3142" fill-opacity="0.05" stroke="none"/>
        <polyline points="208.0,340.0 208.0,322.0 362.0,268.0 362.0,340.0" fill="none" stroke="#2d3142" stroke-opacity="0.70" stroke-width="1.2"/>
        <text x="356.0" y="260.0" class="n" style="font-size:11px" text-anchor="end">C</text>
        <line x1="76" y1="340" x2="76" y2="104" stroke="#4f5d75" stroke-width="1" marker-end="url(#sum_vs_peak_fit-spf-arrow)"/>
        <line x1="76" y1="340" x2="380" y2="340" stroke="#4f5d75" stroke-width="1" marker-end="url(#sum_vs_peak_fit-spf-arrow)"/>
        <text x="76" y="96" class="e">PAGES IN USE</text>
        <text x="219" y="362" class="e" text-anchor="middle">FUTURE STEPS</text>
        <line x1="70" y1="160.0" x2="456" y2="160.0" stroke="#2d3142" stroke-width="1.4"/>
        <text x="82" y="152.0" class="e" style="fill:#2d3142">POOL CAPACITY</text>
        <line x1="76" y1="124.0" x2="440" y2="124.0" stroke="#2d3142" stroke-opacity="0.70" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="82" y="118.0" class="e">SUM OF PEAKS</text>
        <rect x="392" y="268.0" width="48" height="72.0" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75"/>
        <rect x="392" y="196.0" width="48" height="72.0" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75"/>
        <rect x="392" y="124.0" width="48" height="72.0" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75"/>
        <rect x="393" y="125.0" width="46" height="35.0" fill="#2d3142" fill-opacity="0.28"/>
        <text x="416" y="308.0" class="n" style="font-size:11px" text-anchor="middle">A</text>
        <text x="416" y="236.0" class="n" style="font-size:11px" text-anchor="middle">B</text>
        <text x="416" y="176.0" class="n" style="font-size:11px" text-anchor="middle">C</text>
        <line x1="70" y1="160.0" x2="456" y2="160.0" stroke="#2d3142" stroke-width="1.4"/>
        <text x="416" y="358" class="e" text-anchor="middle">AS IF ALL PEAK</text>
        <text x="416" y="370" class="e" text-anchor="middle">AT ONCE</text>
        <rect x="40" y="388" width="410" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="52" y="400" width="56" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
        <text x="80" y="411" class="e" style="fill:#2d3142" text-anchor="middle">REFUSE</text>
        <text x="120" y="412" class="n">Three peaks added: above the pool</text>

        <rect x="490" y="16" width="450" height="420" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.14"/>
        <text x="510" y="44" class="n">Peak fit (PeakPlanner)</text>
        <text x="510" y="60" class="s">MSTAR_KV_ADMISSION_FIT=peak</text>
        <polyline points="546.0,340.0 546.0,322.0 700.0,268.0 700.0,340.0" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <polyline points="612.0,340.0 612.0,322.0 766.0,268.0 766.0,340.0" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <polyline points="678.0,340.0 678.0,322.0 832.0,268.0 832.0,340.0" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <polygon points="546.0,340.0 546.0,322.0 612.0,298.9 612.0,280.9 678.0,234.6 678.0,216.6 700.0,193.4 700.0,265.4 766.0,219.1 766.0,291.1 832.0,268.0 832.0,340.0" fill="#eb6c36" fill-opacity="0.10" stroke="none"/>
        <polyline points="546.0,340.0 546.0,322.0 612.0,298.9 612.0,280.9 678.0,234.6 678.0,216.6 700.0,193.4 700.0,265.4 766.0,219.1 766.0,291.1 832.0,268.0 832.0,340.0" fill="none" stroke="#eb6c36" stroke-width="1.8"/>
        <line x1="546" y1="340" x2="546" y2="104" stroke="#4f5d75" stroke-width="1" marker-end="url(#sum_vs_peak_fit-spf-arrow)"/>
        <line x1="546" y1="340" x2="850" y2="340" stroke="#4f5d75" stroke-width="1" marker-end="url(#sum_vs_peak_fit-spf-arrow)"/>
        <text x="546" y="96" class="e">PAGES IN USE</text>
        <text x="689" y="362" class="e" text-anchor="middle">FUTURE STEPS</text>
        <line x1="540" y1="160.0" x2="926" y2="160.0" stroke="#2d3142" stroke-width="1.4"/>
        <text x="552" y="152.0" class="e" style="fill:#2d3142">POOL CAPACITY</text>
        <circle cx="700.0" cy="193.4" r="4" fill="#eb6c36"/>
        <line x1="708.0" y1="193.4" x2="722.0" y2="193.4" stroke="#eb6c36" stroke-opacity="0.60" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="728.0" y="198.4" class="c" style="fill:#2d3142">highest point of the sum</text>
        <rect x="510" y="388" width="410" height="40" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="522" y="400" width="56" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/>
        <text x="550" y="411" class="e" style="fill:#eb6c36" text-anchor="middle">ADMIT</text>
        <text x="590" y="412" class="n">Highest point of the sum: below the pool</text>

        <line x1="20" y1="452" x2="940" y2="452" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="20" y="468" class="e">LEGEND</text>
        <line x1="20" y1="484" x2="44" y2="484" stroke="#2d3142" stroke-opacity="0.70" stroke-width="1.2"/>
        <text x="52" y="487" class="k">One request's pages (A, B, C)</text>
        <line x1="252" y1="484" x2="276" y2="484" stroke="#eb6c36" stroke-width="1.8"/>
        <text x="284" y="487" class="k">Sum of the three curves (peak fit)</text>
        <line x1="520" y1="484" x2="544" y2="484" stroke="#2d3142" stroke-width="1.4"/>
        <text x="552" y="487" class="k">Pool capacity</text>
        <line x1="680" y1="484" x2="704" y2="484" stroke="#2d3142" stroke-opacity="0.70" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="712" y="487" class="k">Sum of the three peaks (AC)</text>

        <text x="20" y="512" class="s">Curves are illustrative, not measured. Each request grows by one page per page-size tokens until max_tokens,</text>
        <text x="20" y="526" class="s">then completes and frees all its pages. Peak fit tests the maximum of the summed curve, not the sum of the maxima.</text>
      </svg>
