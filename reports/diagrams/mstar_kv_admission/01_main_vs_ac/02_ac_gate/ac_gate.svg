<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 892" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ac_gate-title ac_gate-desc" id="ac_gate-root">
        <title id="ac_gate-title">AC: the admission gate</title>
        <desc id="ac_gate-desc">Flowchart of the admission-control gate: a request joins a strict FIFO wait list holding no pages, only the head computes its reservation, fails at once if it cannot fit even an empty pool, and otherwise runs only if outstanding plus need fits within free plus evictable pages.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ac_gate-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #eb6c36;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ac_gate-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ac_gate-root .diagram-container { width: 100%; overflow-x: auto; }
      #ac_gate-root .diagram-container { overflow-x: visible; }</style>
          <marker id="ac_gate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ac_gate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <line x1="400" y1="96" x2="400" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ac_gate-arrow)"/>
        <line x1="400" y1="184" x2="400" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ac_gate-arrow)"/>
        <line x1="510" y1="268" x2="640" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ac_gate-arrow)"/>
        <line x1="400" y1="320" x2="400" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ac_gate-arrow)"/>
        <line x1="400" y1="416" x2="400" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ac_gate-arrow)"/>
        <line x1="290" y1="500" x2="200" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ac_gate-arrow)"/>
        <line x1="400" y1="552" x2="400" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ac_gate-arrow)"/>
        <line x1="400" y1="712" x2="400" y2="744" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#ac_gate-arrow-accent)"/>
        <path d="M560 648 H752 A8 8 0 0 0 760 640 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ac_gate-arrow)"/>
        <path d="M760 240 V164 A8 8 0 0 0 752 156 H520" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ac_gate-arrow)"/>
        <!-- Arrow labels (masked, 6-10px off the stroke) -->
        <rect x="408" y="330" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="339" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
        <rect x="565" y="248" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="575" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="235" y="480" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="245" y="489" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="408" y="560" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="569" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
        <rect x="408" y="720" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="729" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
        <rect x="646" y="628" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="656" y="637" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="612" y="136" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="636" y="145" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-TEST</text>
        <!-- Nodes -->
        <rect x="280" y="40" width="240" height="56" rx="20" fill="#f5f5f5"/><rect x="280" y="40" width="240" height="56" rx="20" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="400" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Request arrives</text>
        <text x="400" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">conductor stamps max_tokens</text>
        <rect x="280" y="128" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Join FIFO wait list</text>
        <text x="400" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holds no pages while waiting</text>
        <polygon points="400,216 510,268 400,320 290,268" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Head of the list?</text>
        <rect x="280" y="352" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compute reservation</text>
        <text x="400" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prompt - cached + max_tokens</text>
        <text x="400" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pages, summed over every label</text>
        <polygon points="400,448 510,500 400,552 290,500" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fits an empty</text>
        <text x="400" y="510" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pool?</text>
        <polygon points="400,584 560,648 400,712 240,648" fill="#f5f5f5"/><polygon points="400,584 560,648 400,712 240,648" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="400" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">outstanding + need</text>
        <text x="400" y="656" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">≤ free + evictable?</text>
        <text x="400" y="674" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">summed over all admitted</text>
        <rect x="640" y="240" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="640" y="240" width="240" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="760" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stay queued</text>
        <text x="760" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">re-tested as pages free up</text>
        <rect x="240" y="744" width="320" height="64" rx="20" fill="#f5f5f5"/><rect x="240" y="744" width="320" height="64" rx="20" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="400" y="772" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reserve pages and run</text>
        <text x="400" y="788" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">can never hit AllocationFailed</text>
        <rect x="40" y="472" width="160" height="56" rx="20" fill="#f5f5f5"/><rect x="40" y="472" width="160" height="56" rx="20" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="120" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fail at once</text>
        <text x="120" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AdmitRuntimeError</text>
        <!-- Callouts and definitions -->
        <text x="40" y="236" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Nothing passes the head,</text><text x="40" y="254" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">so shorts cannot starve</text><text x="40" y="272" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">a long request.</text>
        <path d="M192 252 Q244 250 288 266" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/><circle cx="290" cy="268" r="2" fill="#2d3142"/>
        <text x="616" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">outstanding = sum of (reservation - pages taken)</text>
        <text x="616" y="700" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">supply = free pages + evictable prefix-cache pages</text>
        <text x="616" y="740" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Conservative: every admitted request is</text><text x="616" y="758" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">charged its full max_tokens from the start,</text><text x="616" y="776" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">and the test assumes all peak together.</text>
        <path d="M608 732 Q560 706 522 666" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/><circle cx="520" cy="664" r="2" fill="#4f5d75"/>
        <line x1="40" y1="836" x2="920" y2="836" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="40" y="852" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="40" y="860" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/><text x="72" y="870" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Start / end (oval)</text><rect x="212" y="860" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="244" y="870" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Step (rectangle)</text><polygon points="372,866 384,860 396,866 384,872" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="408" y="870" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Decision (diamond)</text><rect x="540" y="860" width="24" height="12" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/><text x="572" y="870" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Waiting, not ready</text><polygon points="712,866 724,860 736,866 724,872" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.4"/><text x="748" y="870" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">The fit test</text>
      </svg>
